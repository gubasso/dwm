default_install_hook_types: [pre-commit, pre-push]

# Each check runs in exactly one stage. A hook with no `stages` runs only at
# pre-commit. An upstream manifest that names its own `stages` wins over this
# default, so each such hook below sets `stages: [pre-commit]`. The pre-push
# stage runs only the costly checks, gitleaks and make-build, because a pushed
# commit already passed the pre-commit stage.
default_stages: [pre-commit]

repos:
  # --- Housekeeping (auto-fix where possible) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The two fixers skip the flake.lock that nix writes. A generated file
      # follows its generator, so no hook rewrites it: the dev environment rule
      # of nix-secrets, home/apps/claude-session/rules/dev-environment.md.
      # typos and editorconfig-checker skip it in _typos.toml and
      # .editorconfig-checker.json, so a direct run of either tool agrees.
      - id: trailing-whitespace
        stages: [pre-commit]
        args: [--markdown-linebreak-ext=md]
        exclude: '\.(diff|patch)$|^flake\.lock$'
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '\.(diff|patch)$|^flake\.lock$'
      - id: check-added-large-files
        stages: [pre-commit]
        args: ['--maxkb=16384']
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: detect-private-key
      - id: pretty-format-json
        args: ["--autofix", "--no-ensure-ascii", "--no-sort-keys", "--indent=2"]
        exclude: >-
          (?x)((^|/)devcontainer\.json$|[-.]lock\.json$)
      # - id: no-commit-to-branch

  - repo: https://github.com/maresb/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        exclude: '[-.]lock\.json$'

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.6.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, -disable-indentation, '-exclude', 'LICENSE']

  # --- C: format & lint ---
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        files: \.(c|h)$

  - repo: https://github.com/cpplint/cpplint
    rev: "2.0.2"
    hooks:
      - id: cpplint
        files: \.(c|h)$
        args:
          - --extensions=c,h
          - --linelength=100
          - --filter=-build/c++11,-build/c++17,-build/header_guard,-build/include_subdir,-build/namespaces,-readability/braces,-readability/casting,-readability/constructors,-readability/inheritance,-readability/namespace,-runtime/explicit,-runtime/int,-runtime/printf,-runtime/references,-whitespace/comma,-whitespace/braces,-whitespace/empty_loop_body,-whitespace/line_length,-whitespace/operators,-whitespace/parens,-whitespace/tab

  # --- Spell check ---
  - repo: https://github.com/crate-ci/typos
    rev: v1.43.5
    hooks:
      - id: typos
        stages: [pre-commit]

  # --- Secret scanning (pre-commit, fast) ---
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Heavy checks (pre-push only) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        stages: [pre-push]

  # make-build runs in the dev shell of flake.nix, which supplies make, the
  # compiler, pkg-config, and the X11 and font libraries.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) make and the C toolchain have no hook in a language that pre-commit builds.
      - id: make-build
        name: make clean && make
        entry: bash -c 'make clean && make'
        language: system
        pass_filenames: false
        stages: [pre-push]

  # --- Dependency owners ---
  - repo: local
    hooks:
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'
        stages: [pre-commit]

  # A flake reference reads the git tree of a checkout, never a path copy of
  # the whole folder into the Nix store. The hook is published by exobrain-tech.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.0.0
    hooks:
      - id: no-path-flake-reference
